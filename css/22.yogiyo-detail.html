<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="./commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        .outer{
            width: 600px;
            height: 200px;
            padding: 10px;
        }
        .outer > .inner{
             border: 1px solid gray;
            width: 100%;
            height: 100%;

            font-size: 18px;
            font-weight: bold;
            padding: 1em;
            background-color: white;
        }
    </style>
</head>
<body>
   <div class="container w-1200">
        <div class="cell">
            <div class="float-area">
                <div class="outer">
                    <div class="inner">
                        <div class="float-area w-100;">

                            <img src="https://www.dummyimage.com/90x120">
                            <div  style=font-size:22px;>라이스박스</div>
                            <div  style=font-size:14px;><i class="fa-solid fa-star" style="color: gold;">4.9</i></div>
                            <div style=font-size:14px;>리뷰 858 </div>
                            <div  style=font-size:14px;>요기서 결제 | 5,000원 이상 배달</div>
                            <div  style=font-size:12px;>44~59분</div>
                        </div>
                    </div>
                </div>
                <div class="outer">
                    <div class="inner">한식전문 - 솔낭구</div>
                </div>
                <div class="outer">
                    <div class="inner">한식밥상 - 강남논현점</div>
                </div>
                <div class="outer">
                    <div class="inner">연스시 - 논현직영점</div>
                </div>
                <div class="outer">
                    <div class="inner">파스타스트릿</div>
                </div>
                <div class="outer">
                    <div class="inner">그리너리 - 강남점</div>
                </div>
            </div>
        </div>
   </div>
</body>
</html>
