    <!-- 디자인을 작성하기 위한 영역 -->
    <style>

        /* 테이블 확장 스타일 - 마우스 감지 색상 변경 테이블 */
        .table.table-hover > tbody > tr:hover{
            background-color: azure;
        }

        /* 
            테이블 확장 스타일 - 줄무늬 테이블 
            - nth-child 라는 조건은 "N번쨰 자식" 이라는 뜻
            - 값에 n을 포함 시키면 n=1,2,3,4,5,...로 변하며 적용
        */
        .table.table-stripe > thead >tr,
        .table.table-stripe > tbody > tr:nth-child(2n-1)
        {
            background-color: rgb(245, 255, 255);
        }

        .pagination {
            font-size: 24px;
        }
    </style>
</head>
