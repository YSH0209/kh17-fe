<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 목록</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="./commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>


    </style>
</head>
<body>
   <div class="container w-600">
        <div class="cell center">
            <h1>강좌 목록 및 검색</h1>
        </div>
        <div>
            <form autocomplete="off">
                <select name="column" class="field">
                    <option value="lecture_title">강좌명</option>
                    <option value="lecture_category">카테고리</option>
                    <option value="lecture_duration">강좌시간</option>
                    <option value="lecture_type">강의타입</option>
                </select>
                <input name="keword" type="text" required
                    class="field" placeholder="검색어 입력">
                <button type="submit" class="btn btn-positive">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <span>검색</span>
                </button>
            </form>
        </div>
        <div class="cell right">
            <a href="#" class="btn btn-neutral">
                추가 등록하기
            </a>
        </div>
        <div class="cell">
            결과 수 : 
        </div>
        <div class="cell">
            <table class="table">
                <thead>
                    <tr>
                        <th>강좌 번호</th>
                        <th>카테고리</th>
                        <th class="w-40">강좌 이름</th>
                        <th>강좌 시간</th>
                        <th>강좌 가격</th>
                        <th>강좌 타입</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>시험</td>
                        <td>정보처리기사 필기</td>
                        <td>30</td>
                        <td class="right">300,000</td>
                        <td>혼합</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>시험</td>
                        <td>빅데이터 분석기사 실기</td>
                        <td>120</td>
                        <td class="right">850,000</td>
                        <td>혼합</td>
                    </tr>
                    <tr>
                        <td>3</td>
                        <td>이론</td>
                        <td>DB 기초</td>
                        <td>60</td>
                        <td class="right">500,000</td>
                        <td>혼합</td>
                    </tr>
                    <tr>
                        <td>4</td>
                        <td>실습</td>
                        <td>스프링 부트 마스터</td>
                        <td>120</td>
                        <td class="right">1,200,000</td>
                        <td>오프라인</td>
                    </tr>
                    <tr>
                        <td>5</td>
                        <td>실습</td>
                        <td>클라우드 기초(AWS)</td>
                        <td>90</td>
                        <td class="right">300,000</td>
                        <td>온라인</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="cell">
            <div class="pagination">
                <a href="#"><i class="fa-solid fa-chevron-left"></i></a>
                <a href="#" class="on">1</a>
                <a href="#">2</a>
                <a href="#">3</a>
                <a href="#">4</a>
                <a href="#">5</a>
                <a href="#">6</a>
                <a href="#">7</a>
                <a href="#">8</a>
                <a href="#">9</a>
                <a href="#">10</a>
                <a href="#"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
        </div>


   </div>
</body>
</html>
