<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="./commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        .outer {
            width: 25%;
            /* height : 250px; */
            aspect-ratio: 1/1; /*가로세로 비율 1:1 */
            padding: 10px;
            background-color: whitesmoke;
        }
        .outer > .inner{
            border: 1px solid gray;
            width: 100%;
            height: 100%;

            font-size: 20px;
            font-weight: bold;
            padding: 1em;
            background-color: white;

            /* 배경 이미지를 넣기 위한 설정(background-*) */
            /* background-image: url("https://fastly.picsum.photos/id/292/3852/2556.jpg?hmac=cPYEh0I48Xpek2DPFLxTBhlZnKVhQCJsbprR-Awl9lo"); */
            /* background-image: url("./images/noodle.png"); */
            background-size: 70% 60%;
            background-repeat: no-repeat;
            background-position-x:150%;
            background-position-y: 120%;
        }
    </style>
</head>
<body>
   <div class="container w-1000">
       
       <div class="cell mt-50">
           <div class="float-area" >
               <div class="outer"><div class="inner" style="background-image: url('./images/noodle.png');">전체보기</div>
                </div>
                <div class="outer"><div class="inner">1인분 주문</div>
                </div>
                <div class="outer"><div class="inner">프렌차이즈</div>
                </div>
                <div class="outer"><div class="inner">치킨</div>
                </div>
                <div class="outer"><div class="inner">피자/양식</div>
                </div>
                <div class="outer"><div class="inner">중국집</div>
                </div>
                <div class="outer"><div class="inner">한식</div>
                </div>
                <div class="outer"><div class="inner">일식/돈까스</div>
                </div>
                <div class="outer"><div class="inner">족발/보쌈</div>
                </div>
                <div class="outer"><div class="inner">야식</div>
                </div>
                <div class="outer"><div class="inner">분식</div>
                </div>
                <div class="outer"><div class="inner">카페/디저트</div>
                </div>



            </div>
            </div>
        </div>      
</body>
</html>
