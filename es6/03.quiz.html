<script type=""text/javascript">

    //(Q) data에 들어있는 값을 이용해서 다음 결과를 만들어 내세요
    //1. 홀수만 필터링
    //2. 1번에서 필터링 된 결과 데이터를 각각 제곱
    //3. 2번의 결과를 20 이하만 필터링
    //4. 3번의 결과를 출력
    
    //추가로 알아야 할 함수 : map

    const data = [5, 3, 2, 7, 8, 1, 6];


    const quiz1 = data.filter((number) => (number % 2 != 0));

    console.log(quiz1);

    const quiz2 = quiz1.map(x => x*x);

    console.log(quiz2);
    
    const quiz3 = quiz2.filter((number) => (number <=20));

    console.log(quiz3);

    quiz3.forEach((number)=>console.log(number));
    
    console.log("-------------------")

    data.filter(n=>n%2!=0)
        .map(n=>n*n)
        .filter(n=>n<=20)
        .sort((a,b)=>a-b)
        .forEach(n=>console.log(n));

    console.log("-------------------")

    //(Q) 만약 다음 배열에서 20을 지우려면?
    const numbers = [10, 20, 30, 40, 50];


    //원본이 변경되는 좋지않은 방식
    // const index = numbers.indexOf(20);
    // numbers.splice(index,1);
    // console.log(numbers);

    //사본을 만드는 방식
    // - slice 는 원본 변경 없이 원하는 구간을 잘라서 사본을 만들어냄
    // - filter로 원하는 데이터만 빼고 검색하면 삭제 효과가 발생


    const res = numbers.filter(n => n !== 20)
    console.log(res);

    

</script>
