<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">

    <link rel="stylesheet" type="text/css" href="../css/commons.css">

    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {
            box-shadow: 0 0 0 1px gray;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function () {
            //상태 객체
            var state = {
                lectureTitleValid : false,
                lectureCategoryValid : false,
                lectureDurationValid : false,
                lecturePriceValid : false,
                lectureTypeValid : false,

                ok: function () {
                    return this.lectureTitleValid && this.lectureCategoryValid &&
                        this.lectureDurationValid && this.lecturePriceValid && this.lectureTitleValid;
                }
            };

            //입력창 검사
            document.querySelector("[name=lectureTitle]").addEventListener("blur", function () {
                var valid = this.value.length > 0;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                state.lectureTitleValid = valid;
            });
            document.querySelector("[name=lectureCategory]").addEventListener("input", function () {
                var regex = /^(이론|실습|시험)$/;
                var valid = regex.test(this.valud);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                state.lectureCategoryValid = valid;
            });
            document.querySelector("[name=lectureDuration]").addEventListener("blur", function () {

                var originValue = this.value;
                var replaceValue = orginValue.replace(/[^0-9]/g, "");  //숫자가 아닌 것 -> 빈칸
                this.value = parseInt(replaceValue || 0); // repalceValue가 빈칸이
                state.lectureDurationValid = valid;
            });
            document.querySelector("[name=lecturePrice]").addEventListener("blur", function () {
                // 0원이 아닌 입력이 없을때 feedback fail이 나오게 하는 방법
                var duration = parseInt(this.value); // NaN 나올 수 없음
                var valid = duration <= 300 && duration % 30 == 0;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                state.lecturePriceValid = valid;
            });
            document.querySelector("[name=lectureType]").addEventListener("input", function () {
                var regex = /^(온라인|오프라인|혼합)$/;
                var valid = regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                state.lectureTypeValid = valid;
            });

            //폼검사
            document.querySelector(".form-check").addEventListener("submit", function (e) {
                //입력창 상태 갱신 처리
                

                document.querySelector("[name=lectureTitle]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lectureCategory]").dispatchEvent(new Event('input'));
                document.querySelector("[name=lectureDuration]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lecturePrice]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=lectureType]").dispatchEvent(new Event('input'));

                if (state.ok() == false) {
                    e.preventDefault();
                }
            });

            //(+추가) 파일 입력창에서 이벤트가 발생했을 때 이를 분석
            document.querySelector("[name=attach]").addEventListener("input",function(){
                //this == 파일 선택창
                // * 파일 입력창에는 files 라는 내장 항목이 있고, 파일을 고르거나 취소하면 결과가 담긴다
                //  console.log(this.files);
                if(this.files.length > 0){ //파일을 선택한 경우
                    console.log("파일선택");
                    //미리보기를 구현할 경우, this.files 에 담긴 이미지를 img태그를 만들어 넣고, 화면에 추가


                }
                else{ //파일을 선택 취소한 경우
                    console.log("파일선택취소");
                    //미리보기를 구현할 경우, 기존에 만들어진 모든 미리보기들을 제거해야함
                }
            });
        });


    </script>
</head>

<body>
    <div class="container w-600 mt-50 md-50">
        <div class="cell center">
            <h1>강좌 등록 피드백 구현</h1>
        </div>

        <form action="" autocomplete="off" method="post" enctype="multipart/form-data" class="form-check">
            <div class="container w-500 mt-50 mb-50">
                <div class="cell center">
                    <h1>강좌 정보 등록</h1>
                </div>
                <div class="cell">
                    <label>강좌명 <i class="fa-solid fa-asterisk red"></i></label>
                    <input type="text" name="lectureTitle" placeholder="e.g., 정보처리 산업기사" class="field w-100">
                    <div class="fail-feedback">필수 항목 입니다</div>
                </div>
                <div class="cell">
                    <label>카테고리 <i class="fa-solid fa-asterisk red"></i></label>
                    <select name="lectureCategory" class="field w-100">
                        <option value="">선택하세요</option>
                        <option>이론</option>
                        <option>실습</option>
                        <option>시험</option>
                    </select>
                    <div class="fail-feedback">필수 선택 항목 입니다</div>
                </div>

                <div class="cell">
                    <label>강의시간 <i class="fa-solid fa-asterisk red"></i></label>
                    <input type="text" inputmode="numeric" name="lectureDuration" class="field w-100" value="0">
                    <div class="fail-feedback">필수 항목이며 30시간 단위로만 설정 가능합니다</div>
                </div>

                <div class="cell">
                    <label>수강료 <i class="fa-solid fa-asterisk red"></i></label>
                    <input type="text" inputmode="numeric" name="lecturePrice" value="0" class="field w-100">
                    <div class="fail-feedback">수강료는 0 이상으로 설정해야 합니다</div>
                </div>
                <div class="cell">
                    <label>강의형태 <i class="fa-solid fa-asterisk red"></i></label>
                    <select name="lectureType" class="field w-100" oninput="checkLectureType();">
                        <option value="">선택하세요</option>
                        <option>온라인</option>
                        <option>오프라인</option>
                        <option>혼합</option>
                    </select>
                    <div class="fail-feedback">필수 선택 항목 입니다</div>
                </div>
                <div class="cell mt-50">
                    <label>미리보기</label>
                    <input type="file" name="attach" accept=".png, .jpg" multiple class="field w-100">
                </div>
                <div class="cell mt-40">
                    <button type="submit" class="btn btn-positive w-100">
                        <i class="fa-solid fa-plus"></i>
                        <span>신규 강좌 개설하기</span>
                    </button>
                </div>
            </div>
        </form>

    </div>
</body>

</html>
