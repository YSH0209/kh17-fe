<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이용약관 동의</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {
            box-shadow: 0 0 0 1px #cccccc;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function () {
            //상태 객체
            var state = {
                checkAllValid: false,
                checkRequiredValid: false,
                checkItemValid: false,
                checkItemRequiredValid: false,

                ok: function () {
                    this.checkAllValid && this.checkRequiredValid && this.checkItemValid && this.checkItemRequiredValid;
                }
            };



            //입력창 검사
            // [1] 전체선택
            document.querySelector("[name=check-all]").addEventListener("checkbox", function () {
                var checkboxes = document.querySelectorAll(".check-item");
                for (var i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].checked = all.checked;
                }
            });
            // [2] 필수 항목 선택
            document.querySelector("[name=check-required]").addEventListener("checkbox", function () {
                var checkboxes = document.querySelectorAll(".check-item-required");
                for (var i = 0; i < checkboxes.length; i++) {
                    checkboxes[i].checked = required.checked;
                }
            })
            // [3] 개별 항목 검사
            var count = 0;//전체 체크개수
            var requiredCount = 0;//필수 항목 개수
            var requiredCheckedCount = 0;//필수 체크 개수
            for (var i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {//체크가 되어있다면
                    count++;
                }
                //필수 항목은 따로 검사
                if (checkboxes[i].classList.contains("check-item-required")) {
                    requiredCount++;

                    if (checkboxes[i].checked) {
                        requiredCheckedCount++;
                    }
                }
            }
            //var allChecked = count가 전체 체크박수의 개수와 같은가?
            var allChecked = count == checkboxes.length;

            //필수항목이 모두 선택되었다는건 필수항목 개수와 체크된 필수항목 개수가 같은걸 의미
            var requiredChecked = requiredCount == requiredCheckedCount;

            //allChecked에 따라 전체선택 체크박스를 처리
            var all = document.querySelector(".check-all");
            all.checked = allChecked;

            //requiredChecked에 따라 필수 체크박스를 처리
            var required = document.querySelector(".check-required");
            required.checked = requiredChecked;
            state.checkAllValid = valid;

            //체크박스 검사

        });

    </script>
</head>

<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>이용약관 동의</h1>
            <p>정상적인 사이트 이용을 위해 다음 이용약관에 동의해주세요</p>
        </div>

        <div class="cell mt-50">
            <!-- label 안에 체크박스와 글자를 넣으면 ID 없이 글자와 체크박스가 연결 -->
            <label>
                <input type="checkbox" class="check-all">
                <span>전체 이용약관에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-required">
                <span>필수 이용약관에 동의합니다</span>
            </label>
        </div>

        <hr>

        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required">
                <span>(필수) 개인정보 취급방침에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required">
                <span>(필수) 홈페이지 이용규정을 준수하겠습니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item">
                <span>(선택) 이벤트성 정보 수신에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item">
                <span>(선택) 개인정보 제 3자 제공에 동의합니다</span>
            </label>
        </div>
    </div>
</body>

</html>
