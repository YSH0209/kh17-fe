<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {box-shadow: 0 0 0 1px gray;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        function calculateLength(){
            // [1] 입력창을 선택한다
            var target = document.querySelector(".target");

            // [2] 글자수를 계산한다
            var size = target.value.length;

            // [3] 글자수 표시 영역을 선택하고 , 글자를 작성한다
            var count = document.querySelector(".count");
            count.textContent = size; //입력된게 없을 때 나오는 값 설정 -> textContent

            // [4] 정규표현식을 이용하여 원하는 패턴인지 검사
            var regex = /^[0-9]+$/;
            var numeric = document.querySelector(".numeric");
            if(regex.text(target.value)){ //정규식을 통과 했다면(=숫자만 입력됐다면)
                numeric.textContent = "숫자만 작성되어 있습니다";
            }
            else{ //통과하지 못했다면 (=숫자말고 다른것이 입력됐다면)
                numeric.textContent = "숫자로만 작성하세요";
            }
        }
        
     </script>
</head>
<body>
   <div class="container w-600 mt-50 md-50">
        <div class="cell center">
            <h1>키보드 관련 이벤트</h1>
        </div>

        <div class="cell mt-40">                             <!--처리 방법은 많지만 input으로 처리함-->
            <input type="text" class="field w-100 target" oninput="calculateLength();">
        </div>
        <div class="cell">
            현재 <span class="count">0</span>글자 입력중입니다..
        </div>  

        <div class="cell numeric">
            
        </div>

   </div>
</body>
</html>
