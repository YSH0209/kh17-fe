<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {box-shadow: 0 0 0 1px gray;}


    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        //전체 선택 : check-all 에 input 이벤트가 생기면 .check-item 에 상태를 전파한다
        function checkAll(){
            //전체 선택 체크박스를 가져온다
            var all = document.querySelector(".check-all");
            // console.log(all.checked); //문자열이 나오나 or 논리가 나오나 -> 논리가 나옴

            //체크항목을 불러와서 상태를 전파한다
            var checkboxes = document.querySelectorAll(".check-item");
            for(var i = 0 ; i < checkboxes.length ; i++){
                checkboxes[i].checked = all.checked;
            }
        }
        //필수 항목 선택 : 
        // -.check.required 에 input 이벤트가 생기면 , .check-item-required에 상태를 전파한다
        function checkRequired(){
            //필수 체크박스 선택
            var required = document.querySelector(".check-required");

            //체크 여부를 모든 필수 항목 체크박스에 전파
            var Checkboxes = document.querySelectorAll(".check-item-required");
            for (var i=0; i<checkboxes.length; i++){
                checkboxes[i].checked = required.checked;
            }
        }


        //개별 항목 검사
        // - 개별항목들이 모두 체크되어 있으면 전체를 체크 | 아니면 체크 해제
        // - 모드 체크 되어있는지 확인?
        //      1. 전체 체크박스를 불러와서 체크된 항목을 카운트한다
        //      2. :checked 선택자를 활용

        // [1] 카운트
        function checkItem1(){
            //전체 체크아이템을 불러온다
            var checkboxes = document.querySelectorAll(".check-item");
            var count = 0;
            for( var i = 0 ; i < checkboxes.length ; i++){
                if(checkboxes[i].checked){ //체크가 되어있다면
                    count++;
                }
            }
            // var allchecked = count가 전체 체크박수의 개수와 같은가?
            var allChecked = count == checkboxes.length;

            //allchecked 에 따라 전체 선택 체크박스를 처리 
            var all = document.querySelector(".check-all");
            all.checked = allChecked;
        }
        


     </script>
</head>
<body>
   <div class="container w-600 mt-50 md-50">
        <div class="cell center">
            <h1>이용약관 동의</h1>
            <p>정상적인 사이트 이용을 위해 다음 이용약관에 동의해주세요</p>
        </div>


        <div class="cell mt-50">
            <!-- label 안에 체크박스와 글자를 넣으면 ID없이 글자와 체크박스가 연결됨 -->
            <label>
                <input type="checkbox" class="check-all" oninput="checkAll();" checked>  <!--checked = "checked"-->
                <span>전체 이용약관에 모두 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-required" oninput="checkRequired();">  
                <span>필수 이용약관에 모두 동의합니다</span>
            </label>
        </div>
        <hr>

        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required" oninput="checkItem1();">
                <span>(필수) 개인정보 취급방침에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item check-item-required" oninput="checkItem1();">
                <span>(필수) 홈페이지 이용규정을 준수하겠습니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item" oninput="checkItem1();">
                <span>(선택) 이벤트성 정보 수신에 동의합니다</span>
            </label>
        </div>
        <div class="cell">
            <label>
                <input type="checkbox" class="check-item" oninput="checkItem1();">
                <span>(선택) 개인정보 제 3자 제공에 동의합니다</span>
            </label>
        </div>





   </div>
</body>
</html>
