<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {box-shadow: 0 0 0 1px gray;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        window.addEventListener("load", function(){
            //상태 변수
            // var countryNameValid = false;
            //form 이 2개 이상이라면 객체로 만듬

            //상태 객체
            var state = {
                countryNameValid : false,
                countryCapitalValid : false,
                ok : function(){
                    return this.countryNameValid && this.countryCapitalValid;
                }
            };

            //입력창 검사
            document.querySelector("[name=countryName]").addEventListener("blur",function(){
                //this == 입력창
                var regex = /^[가-힣]{1,10}$/;
                var valid = regex.test(this.value);
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                //return valid;; 의미없는 코드(내가 부르는게 아니라 얻어낼 수 없음)
                state.countryNameValid = valid; //외부 변수에 보관(set)

            });

            document.querySelector("[name=countryCapital]").addEventListener("blur", function(){
                var valid = this.value.length > 0;
                this.classList.remove("success", "fail");
                this.classList.add(valid ? "success" : "fail");
                state.countryCapitalValid = valid;//state에 보관
            });
            //폼 검사
            document.querySelector(".form-check").addEventListener("submit", function(e){
                //검사는 잘 이루어지고 있는데 화면이 아쉽ㄴ다 => 강제로 이벤트 발생
                //
                document.querySelector("[name=countryName]").dispatchEvent(new Event('blur'));
                document.querySelector("[name=countryCapital]").dispatchEvent(new Event('blur'));

                if(state.ok() == false){ //state 가 정상이 아니면
                    e.preventDefault(); //보내는걸 중지하자
                }
            });
        });

     </script>
</head>
<body>
    <form action="" method="post" autocomplete="off" class="form-check">


        <div class="container w-600 mt-50 md-50">
            <div class="cell center">
                <h1>입력폼 검사</h1>
            </div>
            
            <div class="cell"> 
                <label>국가명 <i class="fa-solid fa-asterist red"></i></label>
                <input type="text" name="countryName" class="field w-100">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글로만 작성 가능합니다</div>
            </div>

            
            <div class="cell"> 
                <label>수도명 <i class="fa-solid fa-asterist red"></i></label>
                <input type="text" name="countryCapital" class="field w-100">
                <div class="fail-feedback">필수 항목입니다</div>
            </div>
            
            <div class="cell">
                <button type="submit" class="btn btn-positive w-100">등록하기</button>
            </div>
        </div>
    </form>
</html>
