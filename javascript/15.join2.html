<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //아이디 검사 및 피드백 설정
        function checkMemberId() {
            //입력값 검사
            var tag = document.querySelector("[name=memberId]");//입력창 태그 선택
            var regex = /^[a-z][a-z0-9]{4,19}$/;
            var valid = regex.test(tag.value);

            //피드백 설정
            var feedback = tag.nextElementSibling;
            feedback.classList.remove("blue", "red");//클래스 초기화
            if(valid) {//요구 형식에 부합하면
                feedback.classList.add("blue");
                feedback.textContent = "멋진 아이디입니다!";
            }
            else {//요구 형식에 부합하지 않으면
                feedback.classList.add("red");
                feedback.textContent = "영문 소문자로 시작하고 숫자를 포함한 5~20글자로 작성하세요";
            }
        }
    
        //비밀번호 검사 및 피드백 설정
        function checkMemberPassword() {
            //입력값 불러오기 및 검사
            var tag = document.querySelector("[name=memberPassword]");//태그선택
            var tag2 = document.querySelector(".password-check");
            //var regex = /^(?=.*?[A-Z]+)(?=.*?[a-z]+)(?=.*?[0-9]+)(?=.*?[!@#$]+)[A-Za-z0-9!@#$]{8,16}$/;
            var regex = /^(?=.*?[A-Z]+)(?=.*?[a-z]+)(?=.*?[0-9]+)(?=.*?[\!\@\#\$\%\^\&\*\(\)\-\_\=\+\[\]\{\}\'\"\`\~\<\>\.\,\/\?\\\|]+)[A-Za-z0-9\!\@\#\$\%\^\&\*\(\)\-\_\=\+\[\]\{\}\'\"\`\~\<\>\.\,\/\?\\\|]{8,16}$/;
            var valid = regex.test(tag.value);
            var valid2 = tag.value == tag2.value; //서로 같은지 판정

            //피드백 설정
            var feedback = tag.nextElementSibling;//뒤 태그 선택
            var feedback2 = tag2.nextElementSibling;
            feedback2.classList.remove("blue", "red"); //클래스 초기화


            if(valid) {
                feedback.classList.add("blue");
                feedback.textContent = "올바른 형식의 비밀번호입니다";
            }
            else {
                feedback.classList.add("red");
                feedback.textContent = "대문자, 소문자, 숫자, 특수문자를 반드시 포함하여 8~16글자로 작성하세요";
            }

             //비밀번호가 없는 경우를 고려
                if(tag.value.length == 0){
                    feedback2.classList.add("red");
                    feedback2.textContent = "비밀번호를 입력하세요";
                }

                else if(valid2){
                    feedback2.classList.add("blue");
                    feedback2.textContent = "비밀번호가 일치합니다"

                }
                else{
                    feedback2.textContent = "비밀번호가 일치하지 않습니다";
                    feedback2.classList.add("red");
                }


            
            
        }
    </script>
</head>
<body>
    <form autocomplete="off">

    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>회원 정보 입력</h1>
        </div>

        <!-- 아이디 입력창과 피드백 -->
        <div class="cell">
            <label>아이디 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="memberId" class="field w-100" oninput="checkMemberId();">
            <!-- 피드백 영역은 찾기쉽게 입력창의 바로 뒤에 두자! -->
            <div></div>
        </div>
        

        <!-- 비밀번호 입력창과 피드백 -->
        <div class="cell">
            <label>비밀번호 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" name="memberPassword" class="field w-100" oninput="checkMemberPassword();">
            <div></div>
        </div>

        <!-- 비밀번호 확인창과 피드백 -->
         <div class="cell">
            <label>비밀번호 확인 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="password" class="field w-100 password-check" oninput="checkMemberPassword();">
            <div></div>
         </div>
    </div>

    </form>
</body>
</html>
