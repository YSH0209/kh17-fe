<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">

    <link rel="stylesheet" type="text/css" href="../css/commons.css">

    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">


    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {
            box-shadow: 0 0 0 1px gray;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //이벤트 중복 설정이 가능하도록 하기 위한 새로운 명령 : addEventListener 함수 사용
        window.addEventListener("load", function(){
            var btn = document.querySelector(".btn");
            btn.addEventListener("click", function(){
                 var target = document.querySelector(".target");
                target.style.color = "red";
            });

            
        });

            window.addEventListener("load", function(){
            var btn = document.querySelector(".btn");
            btn.addEventListener("click", function(){
                 var target = document.querySelector(".target");
                target.style.backgroundColor = "yellow";
            });
        });

        // [1]. 자바 스크립트에서 독자적으로 처리 가능
        // [2]. 여러 이벤트들을 제한 없이 추가할 수 있다
        // 문법자체의 난이도가 올라가는 단점이 존재한다

        //  -> 이 방식은 여러개의 이벤트가 중복 설정이 가능하다

    </script>
</head>

<body>
    <div class="container w-600 mt-50 md-50">
        <div class="cell center">
            <h1>독립형 자바스크립트</h1>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-positive w-100">색상변경</button>
        </div>

        <div class="cell">
            <h2 class="target">Hello Javascript!</h2>
        </div>
    </div>
</body>

</html>
