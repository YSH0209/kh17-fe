<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div {
            box-shadow: 0 0 0 1px #cccccc;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        window.addEventListener("load", function () {
            var numberButtons = document.querySelectorAll(".btn-number");
            for (var i = 0; i < numberButtons.length; i++) {
                numberButtons[i].addEventListener("click", function () {
                    //parseInt 를 동해 문자열을 int값으로 변환함
                    var target = document.querySelector(".target");
                    var currentValue = parseInt(target.value) || 0; //현재 값 -> 나와 있는 값 || 초기엔 0
                    var addValue = parseInt(this.dataset.number); // 더할 값 -> 버튼으로 누른 값 (this 가 뭐일진 모름)
                    var result = currentValue + addValue;   //결과 값 -> 현재값 + 더할값
                    target.value = result;
                });
            }

            //한글자 지우기
            var deleteButton = document.querySelector(".btn-delete");
            deleteButton.addEventListener("click", function () {
                var target = document.querySelector(".target");
                var origin = target.value;
                target.value = origin.substring(0, origin.length - 1);
            });


            //모두 지우기
            var clearButton = document.querySelector(".btn-clear");
            clearButton.addEventListener("click", function () {
                var target = document.querySelector(".target");
                target.value = "0";
            });

        });



    </script>
</head>

<body>
    <div class="container w-800 mt-50 mb-50">
        <div class="cell center">
            <h1>이체 금액 입력</h1>
        </div>

        <div class="cell mt-40">
            <input class="field w-100 target right" placeholder="이체할 금액을 입력하세요" value="0">
        </div>

        <div class="cell">
            <button type="button" class="btn btn-neutral btn-number" data-number="100000000">억</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="10000000">천만</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="1000000">백만</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="100000">십만</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="10000">만</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="1000">천</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="100">백</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="10">십</button>
            <button type="button" class="btn btn-neutral btn-number" data-number="1">일</button>
            <button type="button" class="btn btn-negative btn-delete">
                <i class="fa-solid fa-delete-left"></i>
            </button>
            <button type="button" class="btn btn-negative btn-clear">
                <i class="fa-solid fa-eraser"></i>
            </button>
        </div>

        <div class="cell mt-50" style="font-size: 24px;">
            이체하시려는 금액은 총 <span class="display">0</span>원 입니다.
        </div>
    </div>
</body>

</html>

</html>
