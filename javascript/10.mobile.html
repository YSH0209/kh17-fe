<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        /* div {box-shadow: 0 0 0 1px gray;} */

        .outer {
            width: 33%;
            /* height : 250px; */
            aspect-ratio: 2/1; /*가로세로 비율 1:1 */
            padding: 10px;
            background-color: white;
        }
        .outer > .inner{
            border: 1px solid white;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 0 1px black;

            font-size: 20px;
            font-weight: bold;
            padding: 1em;
            background-color: white;
            text-align: center;

            /* 배경 이미지를 넣기 위한 설정(background-*) */
            /* background-image: url("https://fastly.picsum.photos/id/292/3852/2556.jpg?hmac=cPYEh0I48Xpek2DPFLxTBhlZnKVhQCJsbprR-Awl9lo"); */
            /* background-image: url("./images/noodle.png"); */
            background-size: 70% 60%;
            background-repeat: no-repeat;
            background-position-x:150%;
            background-position-y: 120%;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        function displayClear(){
            var display = document.querySelector(".display");
            display.value="";
        }

        function displayOneClrear(){
            //마지막 한글자를 지운다 = 입력글자를 꺼내와서 끝 부분을 잘라낸 뒤 재설정
            // => 잘라내는 명령 : substring(시작점, 끝점)
            // => 글자수 구하기 : length

            var display = document.querySelector(".display");
            var origin = display.value;
            var cut = origin.substring(0, origin.length-1);
            display.value=cut;

        }
     </script>
</head>
<body>
   <div class="container w-600 mt50 md-50">
        <div class="cell center">
            <h1>휴대전화 키패드 문제</h1>
        </div>
        <div class="cell">
            <input type="text" class="field w-100 display" placeholder="전화번호 입력">
        </div>

        <div class="cell">
            <div class="float-area">
                <div class="outer">
                    <div class="inner">7</div>
            </div>
             <div class="outer">
                    <div class="inner">8</div>
            </div>
             <div class="outer">
                    <div class="inner">9</div>
            </div>
            
        </div>

        <div class="float-area">
            <div class="cell">
                    <button type="button" class="btn btn-negative" onclick="displayClear();"> 전부 지우기</button>
            </div>

            <div class="cell">
                <button type="button" class="btn btn-negative" onclick="displayOneClrear();">한글자 지우기</button>
            </div>
         </div>

   </div>
</body>
</html>
