<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    
    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {box-shadow: 0 0 0 1px gray;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
        // 기존의 방식 : 함수를 만들고 태그를 제어하게 만든 뒤 onclick 과 같은 속성으로 호출
        function changeColor(){
            var target = document.querySelector(".target");
            target.style.color = "red";
        }

        // ( * 나중에 실행되게 만들어야 함)

        //버튼 선택 (코드의 작성 순서 때문에 제대로 선택이 안됨)
        var btn = document.querySelector(".btn");
        btn.onclick = changeColor; //onclick = "changeColor();" 와 같은코드 (콜백 설정 | call-back) 그래서 함수에 괄호를 쓰지 않은것임
        // btn.onclick = function(){ changeColor(); }; //같은 코드

        
     </script>
</head>
<body>
   <div class="container w-600 mt-50 md-50">
        <div class="cell center">
            <h1>독립형 자바스크립트</h1>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-positive w-100">색상변경</button>
        </div>

        <div class="cell">
            <h2 class="target">Hello Javascript!</h2>
        </div>
   </div>
</body>
</html>
