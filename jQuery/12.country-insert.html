<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <link rel="icon" href="/kh.png" type="image/png">

    <link rel="stylesheet" type="text/css" href="../css/commons.css">

    <link rel="stylesheet" type="text/css"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {
            box-shadow: 0 0 0 1px gray;
        }
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function () {
            //상태 객체
            var state = {
                countryRegionValid: false,
                countryNameValid: false,
                countryCapitalValid: false,
                countryPopulationValid: false,
                ok: function () {
                    return Object.values(this) //이 객체의 모든 이름에 대한 값을 반환
                        .filter(v => typeof v === "boolean") //boolean 값만 추출해서
                        // .filter(function(v)){
                        //     return typeof v === "boolean"arguments
                        // })
                        .every(v => v === true); //모두 true 인지 확인해서 반환해라!
                    // .every(function(v){
                    //     return v === true;
                    // });

                    // * === * 는 형태까지 같은 것을 의미
                }
            };
            //개별 입력창 검사
            $(function () {
                // 상태 객체
                var state = {
                    countryRegionValid: false,
                    countryNameValid: false,
                    countryCapitalValid: false,
                    countryPopulationValid: false,
                    ok: function () {
                        return Object.values(this)
                            .filter(v => typeof v === "boolean")
                            .every(v => v === true);
                    }
                };

                // 대륙명 검사
                $("[name=countryRegion]").on("input", function () {
                    var regex = /^(아시아|아프리카|[남북]아메리카|유럽|오세아니아)$/;
                    var valid = regex.test($(this).val());
                    $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                    state.countryRegionValid = valid; // 오타 수정: valud -> valid
                });

                // 국가명 검사
                $("[name=countryName]").on("blur", function () {
                    var regex = /^[가-힣]{1,10}$/;
                    var valid = regex.test($(this).val()); // 오타 수정: $(this.val()) -> $(this).val()
                    $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                    state.countryNameValid = valid;
                });

                // 수도명 검사
                $("[name=countryCapital]").on("blur", function () {
                    var valid = $(this).val().length > 0;
                    $(this).removeClass("success fail").addClass(valid ? "success" : "fail"); // 오타 수정: succcess -> success
                    state.countryCapitalValid = valid;
                });

                // 인구 검사
                $("[name=countryPopulation]").on("blur", function () { // 오타 수정: ] 닫기 추가
                    var value = $(this).val();
                    var valid = value.length > 0 && parseInt(value) > 0;
                    $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                    state.countryPopulationValid = valid;
                });

                // 숫자 입력 제어
                $("[inputmode=numeric]").on("input", function () {
                    var regex = /[^0-9]+/g;
                    var replacement = $(this).val().replace(regex, "");
                    $(this).val(replacement);
                });

                // 폼 검사 (전송 시)
                $(".form-check").on("submit", function () {
                    // 모든 필드에 대해 강제로 이벤트를 발생시켜 최신 상태를 업데이트함
                    $("[name=countryRegion]").trigger("input");
                    $("[name=countryName], [name=countryCapital], [name=countryPopulation]").trigger("blur");

                    return state.ok(); // 최종 상태 확인
                });
            });
        });

    </script>
</head>

<body>
    <form action="" method="post" autocomplete="off" class="form-check">

        <div class="container w-600 mt-50 md-50">
            <div class="cell center">
                <h1>입력폼 검사</h1>
            </div>

            <div class="cell">
                <label>대륙명 <i class="fa-solid fa-asterisk red"></i></label>
                <select name="countryRegion" class="field w-100">
                    <option value="">선택하세요</option>
                    <option>아시아</option>
                    <option>아프리카</option>
                    <option>북아메리카</option>
                    <option>남아메리카</option>
                    <option>유럽</option>
                    <option>오세아니아</option>
                </select>
                <!-- <div class="success-feedback"></div> -->
                <div class="fail-feedback">필수 항목입니다</div>
            </div>

            <div class="cell">
                <label>국가명 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="countryName" class="field w-100">
                <div class="success-feedback">올바른 형식의 이름입니다</div>
                <div class="fail-feedback">한글로만 작성 가능합니다</div>
            </div>


            <div class="cell">
                <label>수도명 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" name="countryCapital" class="field w-100">
                <div class="fail-feedback">필수 항목입니다</div>
            </div>

            <div class="cell">
                <label>인구 <i class="fa-solid fa-asterisk red"></i></label>
                <input type="text" inputmode="numeric" name="countryPopulation" class="field w-100">
                <div class="fail-feedback">0보다 큰 숫자만 가능합니다</div>
            </div>


            <div class="cell">
                <button type="submit" class="btn btn-positive w-100">등록하기</button>
            </div>
        </div>


    </form>
</body>

</html>
