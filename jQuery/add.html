<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트</title>

    <!-- lightpick cdn -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/css/lightpick.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.22.2/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightpick@1.6.2/lightpick.min.js"></script>
    
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    
    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="./preview.js"></script>

    <!-- 디자인을 작성하기 위한 영역 -->
    <style>
        div {box-shadow: 0 0 0 1px gray;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
     <script>
       $(function(){
    // 상태 관리 객체 (state)
    var state = {
        deptIdValid: false,
        deptNameValid: false,
        ok: function(){
            return Object.values(this)
            .filter(v => typeof v === "boolean")
            .every(v => v === true);
        }
    };

    $("[name=deptId]").on("blur", function(){
        var value = $(this).val();
        var regex = /^[0-9]{1,10}$/;
        var valid = regex.test(value);
        
        if(valid == false){
            $(this).removeClass("success fail").addClass("fail").attr("data-error","1");
            state.deptIdValid = false; 
            return;
        }
        
        $(this).removeClass("success fail").addClass("success").removeAttr("data-error");
        state.deptIdValid = true;
    });

    $("[name=deptName]").on("blur", function(){
        var regex = /^[가-힣]{1,20}$/;
        var deptName = $(this).val();
        var valid = regex.test(deptName);
        
        if(valid == false){
            $(this).removeClass("success fail").addClass("fail").attr("data-error", "1");
            state.deptNameValid = false; 
            return;
        }
        
        $(this).removeClass("success fail").addClass("success").removeAttr("data-error");
        state.deptNameValid = true;
    });

    $(".form-check").on("submit", function () {
        $(this).find("select[name]").trigger("input");
        $(this).find("input[name]").trigger("blur");
        return state.ok();
    });

    $(".field.field-numeric").on("input", function () {
        var regex = /[^0-9]/g;
        var origin = $(this).val();
        var replacement = origin.replace(regex, "");
        $(this).val(replacement);
    });
});
     </script>
</head>
<body>
  <form action="addFinish" method="post" autocomplete="off" class="form-check">

	<div class="container w-400 mt-50">
		<div class="cell center">
			<h1>부서 등록 페이지</h1>
		</div>

		<div class="cell">
                <label>부서코드</label>
                <input type="text" name="deptId" class="field field-numeric w-100 fail" data-error="1">
                <div class="success-feedback">사용할 수 있는 코드입니다</div>
                <div class="fail-feedback">
                    <div>10자리 이내의 숫자로 입력해주세요</div>
                    <div>이미 사용중인 코드 입니다</div>
                </div>
            </div>
		<div class="cell">
			<label>부서명</label> 
            <input class="field w-100 fail" data-error="1" type="text"
				name="deptName">
                <div class="fail-feedback">
                    <div>20자 이내의 한글로 입력해주십시오</div>
                    <div>이미 사용중인 부서명 입니다</div>
                </div>
		</div>
		<div class="cell">
			<label>사용 여부 (Y/N)</label> <input type="checkbox" class="field" name="deptUseYn">
		</div>

		<button class="btn btn-neutral field w-100">입력 완료</button>
	</div>

</form>


   </div>
</body>
</html>
