<!DOCTYPE html>

<head>

                // $(this).parent(".cell").prev(".cell").children(".target").remove(); //지우기

                // $(this).parent(".cell").prev(".cell").children(".target").css("visibility", "hidden");

</head>
<body>
   <div class="container w-600 mt-50 md-50">
        <div class="cell center">

        </div>

        <div class="cell mt-50">
            <h2 class="target">제어당할 텍스트</h2>
        </div>

            <button type="button" class="btn btn-positive btn-control">제어할 버튼
