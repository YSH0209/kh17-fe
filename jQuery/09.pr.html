<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            $(".field-answer").on("input", function(){
                // this는 입력이 발생한 textarea
                // var size = this.value.length;//js
                var size = $(this).val().length;//jquery

                $(this).parent(".cell").next(".cell").children("span").text(size);//jquery
            });
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>자기소개서</h1>
        </div>

        <div class="cell mt-40">
            <h3>(Q) 당신의 성장과정에 대해서 소개해주세요</h3>
        </div>
        <div class="cell">
            <textarea name="q1" class="field w-100 field-answer" rows="10"></textarea>
        </div>
        <div class="cell right">
            <span>0</span> / 1000글자
        </div>

        <div class="cell mt-40">
            <h3>(Q) 당신의 성격에 대한 장단점을 적어주세요</h3>
        </div>
        <div class="cell">
            <textarea name="q2" class="field w-100 field-answer" rows="10"></textarea>
        </div>
        <div class="cell right">
            <span>0</span> / 1000글자
        </div>

        <div class="cell mt-40">
            <h3>(Q) 역경을 이겨낸 경험이 있다면 적어주세요</h3>
        </div>
        <div class="cell">
            <textarea name="q3" class="field w-100 field-answer" rows="10"></textarea>
        </div>
        <div class="cell right">
            <span>0</span> / 1000글자
        </div>

        <div class="cell mt-40">
            <h3>(Q) 우리 회사에 지원한 동기가 무엇입니까?</h3>
        </div>
        <div class="cell">
            <textarea name="q4" class="field w-100 field-answer" rows="10"></textarea>
        </div>
        <div class="cell right">
            <span>0</span> / 1000글자
        </div>

        <div class="cell mt-40">
            <h3>(Q) 우리 회사 입사 후 10년뒤의 모습을 상상해서 적어주세요</h3>
        </div>
        <div class="cell">
            <textarea name="q5" class="field w-100 field-answer" rows="10"></textarea>
        </div>
        <div class="cell right">
            <span>0</span> / 1000글자
        </div>
    </div>
</body>
</html>
